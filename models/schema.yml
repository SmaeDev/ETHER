version : 2

models:
  - name: stg_transactions
    description: Transactions in eth
    columns: 
      - name: hash
        description: >
          Very long description
          not bad
        data_tests:
          - unique
          - not_null

  - name: stablecoin_activity_per_day
    # description: Transactions in eth
    latest_version: 1
    config:
      contract:
        enforced: true
    columns:
      - name: date
        data_type: date
        description: ""

      - name: token_address
        data_type: varchar
        description: ""

      - name: type
        data_type: varchar
        description: ""

      - name: symbol
        data_type: varchar
        description: ""

      - name: total_usd_value
        data_type: float
        description: ""

    versions:
      - v: 1
        deprecation_date: 2030-01-01
      - v: 2
        columns:
          - include: all
            exclude: [token_address, symbol]